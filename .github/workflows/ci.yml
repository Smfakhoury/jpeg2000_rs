name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: cargo test --all-targets --locked
      - run: cargo check --release --all-targets --locked

  quality:
    name: Quality and package audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Audit package contents
        shell: bash
        run: diff -u validation/expected-package-files.txt <(cargo package --list --locked)

  decoder-validation:
    name: Generated decoder validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python3 -m pip install -r validation/requirements.txt
      - run: python3 -m unittest discover -s validation/tests -v
      - run: python3 validation/run-validation.py source --check
      - run: python3 validation/run-validation.py all
