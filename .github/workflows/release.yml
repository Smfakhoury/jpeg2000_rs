name: Release preflight (no upload)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Package publication dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Require the 0.1 release branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/release/0.1" ]; then
            echo "::error::Release preflight must run from release/0.1."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Check release metadata
        run: |
          mkdir -p target/publication
          cargo metadata --no-deps --format-version 1 --locked \
            > target/publication/cargo-metadata.json
          jq -e '
            (.packages | length == 1) and
            (.packages[0] |
              .name == "jpeg2000-decoder" and
              (.version | test("^0\\.1\\.[0-9]+$")) and
              .publish == ["crates-io"] and
              .rust_version == "1.88.0" and
              any(.targets[]; .name == "jpeg2000_decoder" and .kind == ["lib"]))
          ' target/publication/cargo-metadata.json
          version=$(jq -r '.packages[0].version' target/publication/cargo-metadata.json)
          echo "CRATE_VERSION=$version" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > target/publication/source-commit.txt
      - name: Check the package inventory
        run: diff -u validation/expected-package-files.txt <(cargo package --list --locked)
      - name: Build and verify without uploading
        run: |
          cargo publish --dry-run --locked 2>&1 | tee target/publication/dry-run.log
          grep -F "aborting upload due to dry run" target/publication/dry-run.log
          sha256sum "target/package/jpeg2000-decoder-$CRATE_VERSION.crate" \
            > target/publication/SHA256SUMS
      - name: Retain the exact preflight archive and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-preflight-${{ env.CRATE_VERSION }}
          path: |
            target/package/jpeg2000-decoder-${{ env.CRATE_VERSION }}.crate
            target/publication/
          if-no-files-found: error
          retention-days: 30
