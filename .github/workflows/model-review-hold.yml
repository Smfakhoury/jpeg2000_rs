name: Model review hold

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  model-review-hold:
    name: Model-review hold
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted base controller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Inspect committed changes without executing proposed code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "Pull request head changed during inspection; rerun against the current head."
            exit 1
          fi
          python3 validation/check-model-review-hold.py -- "$BASE_SHA" "$HEAD_SHA"
